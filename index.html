<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 91 Junction · Menu</title>
<meta name="description" content="Menu at The 91 Junction. Swipe or use the arrows to turn pages.">
<meta name="theme-color" content="#111111">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #111111;
    --fg: #f5f5f5;
    --muted: rgba(255,255,255,.62);
    --btn: rgba(255,255,255,.12);
    --btn-hover: rgba(255,255,255,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; font-size: 14px; color: var(--muted);
    padding-top: max(10px, env(safe-area-inset-top));
  }
  header b { color: var(--fg); font-weight: 600; letter-spacing: .01em; }
  main {
    position: relative; flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  main img {
    max-width: 100%; max-height: 100%; width: auto; height: auto;
    display: block; user-select: none; -webkit-user-drag: none;
    transition: opacity .15s ease;
  }
  main img.loading { opacity: .35; }
  footer {
    display: flex; align-items: center; justify-content: center; gap: 24px;
    padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  .nav {
    width: 72px; height: 48px; border: 0; border-radius: 12px;
    background: var(--btn); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .nav:hover { background: var(--btn-hover); }
  .nav:active { transform: scale(.96); }
  .nav:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .nav svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .dots { display: flex; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.28); border: 0; padding: 0; cursor: pointer; }
  .dot.on { background: #fff; }
</style>
</head>
<body>
<header>
  <b>The 91 Junction</b>
  <span id="counter" aria-live="polite">1 / 6</span>
</header>
<main id="stage">
  <img id="img" src="images/menu/5_Nov_2026/page_1.jpeg" alt="Menu page 1">
</main>
<footer>
  <button class="nav" id="prev" aria-label="Previous page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="dots" id="dots" aria-label="Pages"></div>
  <button class="nav" id="next" aria-label="Next page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</footer>

<script>
  // To update the menu: replace the paths below. Paths are relative to this
  // file and case-sensitive on GitHub Pages. The first entry is shown on load.
  const IMAGES = [
    'images/menu/5_Nov_2026/page_1.jpeg',
    'images/menu/5_Nov_2026/page_2.jpeg',
    'images/menu/5_Nov_2026/page_3.jpeg',
    'images/menu/5_Nov_2026/page_4.jpeg',
    'images/menu/5_Nov_2026/page_5.jpeg',
    'images/menu/5_Nov_2026/page_6.jpeg',
  ];

  const img = document.getElementById('img');
  const counter = document.getElementById('counter');
  const dots = document.getElementById('dots');
  const stage = document.getElementById('stage');
  const total = IMAGES.length;
  let index = 0;

  // Build the page dots.
  IMAGES.forEach((_, i) => {
    const d = document.createElement('button');
    d.className = 'dot';
    d.setAttribute('aria-label', 'Go to page ' + (i + 1));
    d.addEventListener('click', () => show(i));
    dots.appendChild(d);
  });

  function preload(i) {
    const n = new Image();
    n.src = IMAGES[(i + total) % total];
  }

  function show(i, fromHash) {
    index = (i + total) % total;
    if (img.getAttribute('src') !== IMAGES[index]) {
      img.classList.add('loading');
      img.src = IMAGES[index];
    }
    img.alt = 'Menu page ' + (index + 1);
    counter.textContent = (index + 1) + ' / ' + total;
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === index));
    if (!fromHash) history.replaceState(null, '', '#' + (index + 1));
    preload(index + 1);
    preload(index - 1);
  }

  img.addEventListener('load', () => img.classList.remove('loading'));
  img.addEventListener('error', () => img.classList.remove('loading'));

  document.getElementById('prev').addEventListener('click', () => show(index - 1));
  document.getElementById('next').addEventListener('click', () => show(index + 1));

  // Keyboard arrows.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') show(index - 1);
    if (e.key === 'ArrowRight') show(index + 1);
  });

  // Swipe left/right. Ignored while pinch-zoomed so zooming into the menu
  // text still works normally.
  let startX = 0, startY = 0, tracking = false;
  stage.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { tracking = false; return; }
    tracking = true;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    const zoomed = window.visualViewport && window.visualViewport.scale > 1.01;
    if (zoomed) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      show(dx < 0 ? index + 1 : index - 1);
    }
  }, { passive: true });

  // Open on the page in the URL hash (e.g. #2), otherwise the first page.
  const fromHash = parseInt(location.hash.slice(1), 10);
  show(fromHash >= 1 && fromHash <= total ? fromHash - 1 : 0, true);
</script>
</body>
</html>
